# SedTRAILS Configuration Template
# Generated by `sedtrails config create` from the active validation schema.
# Replace the input path, times, coordinates, and release settings for your model.

general:
  input_model:
    format: fm_netcdf
    reference_date: '1970-01-01'
    morfac: 1
  preprocess: true
  compute_pathways: true
  n_runs: 1
  display_input_metadata: false
  numerical_scheme: rk4
inputs:
  data: ./sample-data/inlet_sedtrails.nc
  read_interval: 10D
  repeat_eulerian_fields: false
time:
  start: '2016-09-21 19:20:00'
  timestep: 60S
  duration: 1D
  cfl_condition: 0.7
physics:
  constants:
    grain_diameter: 0.00025
    morphology_factor: 1.0
    porosity: 0.4
    g: 9.81
    von_karman: 0.4
    kinematic_viscosity: 1.36e-06
    rho_w: 1027.0
    rho_s: 2650.0
    friction_angle: 30.0
    diffusion_coefficient: 0.1
  bed_slope:
    calculate: false
    resolution: 100.0
    bedslope_check_plot: false
    bedslope_caxis_factor: 100.0
    bedslope_alpha_bs: 1.0
    bedslope_alpha_bn: 1.5
particles:
  populations:
    - name: FineSand
      particle_type: sand
      tracer_methods:
        vanwesten:
          flow_field_name:
            - bed_load_velocity
            - suspended_velocity
          beta: 0.2
      seeding:
        release_start: '2016-09-21 19:30:00'
        strategy:
          random:
            bbox: 39400,16800 40600,17800
            nlocations: 1
            seed: 42
            show_check_plots: false
            save_check_plots: false
        burial_depth:
          constant: 0
        class: clusters
        quantity: 1
        per_timestep: false
        release_type: instantaneous
        lifespan: 9.0e+99
      characteristics:
        density: 2650.0
        grain_size: 0.0005
      transport_probability: no_probability
pathways:
  polygon_query: false
  analyze: false
outputs:
  directory: ./results
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: true
    update_interval: 1H

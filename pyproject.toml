[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sedtrails"
dynamic = ["version"]
description = "Sediment TRAnsport vIsualization and Lagrangian Simulator."
dependencies = [
  "jsonschema",
  "numpy<2.2,>=1.24",
  "scipy",
  "pyyaml",
  "pandas",
  "matplotlib",
  "xarray",
  "netCDF4",
  "typer >=0.16.0,<1.0",
  "xugrid",
  "numba",
  "tqdm",
  "referencing>=0.36.2",
]
requires-python = ">=3.10, <3.14"
authors = [
  { name = "Stuart Pearson", email = "s.g.pearson@tudelft.nl" },
  { name = "Johan Reyns", email = "johan.reyns@deltares.nl" },
  { name = "Manuel Garcia Alvarez", email = "m.garciaalvarez@tudelft.nl" },
  { name = "Aysun Urhan" },
  { name = "Bart van Westen" },
  { name = "Natascia Pannozzo" },
  { name = "Hassan Shafiei" },
]
maintainers = [
  { name = "Stuart Pearson", email = "s.g.pearson@tudelft.nl" },
  { name = "Johan Reyns", email = "johan.reyns@deltares.nl" },
]
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E.*"]
keywords = ["sediment", "analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Topic :: Documentation :: Sphinx",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
cli = ["typer>=0.16.0,<1.0"]
dev = [
  "click>=8.0.0",
  "pytest",
  "ruff",
  "sphinx==8.2.0",
  "myst-parser==4.0.1",
  "sphinx-rtd-theme",
  "sphinx-autodoc2>=0.5.0",
]

[tool.hatch.version]
path = "src/sedtrails/__version__.py"
[tool.hatch.build]
include = ["src/sedtrails/config/schema.json"]

[tool.hatch.build.targets.wheel]
packages = ["src/sedtrails"]

[project.urls]
Homepage = "https://github.com/sedtrails/sedtrails"
Documentation = "https://sedtrails.github.io/sedtrails"
Repository = "https://github.com/sedtrails/sedtrails.git"
"Bug Tracker" = "https://github.com/sedtrails/sedtrails/issues"
Changelog = "https://github.com/sedtrails/sedtrails/blob/main/CHANGELOG.md"

[project.scripts]
sedtrails = "sedtrails.application_interfaces.cli:app"

[tool.pytest.ini_options]
pythonpath = "src"
addopts = ["--import-mode=importlib"]
markers = ["integration: mark a test as an integration test."]
filterwarnings = [
  'ignore:.*:pyparsing.warnings.PyparsingDeprecationWarning:matplotlib\._fontconfig_pattern',
  'ignore:.*:pyparsing.warnings.PyparsingDeprecationWarning:matplotlib\._mathtext',
  'ignore:numpy\.ndarray size changed, may indicate binary incompatibility\..*:RuntimeWarning',
]

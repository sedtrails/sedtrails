general:
  input_model: 
    format: fm_netcdf
    reference_date: 1970-01-01  # Default reference date for the input model
    morfac: 1  # Morphological acceleration factor for time decompression
inputs:
  data: ../../sample-data/inlet_sedtrails.nc
  read_interval: 10D  # Time chunk size for reading input data
  repeat_eulerian_fields: true  # Set true to loop forcing from the first input timestamp
# Optional domain controls for islands/cutouts and boundary actions.
# Tekal .pol paths are resolved relative to this configuration file.
domain:
  pol_file: ./outer_domain.pol
  inner_boundary_pol_files:
    - ./islands_small.pol
  boundary_class_pol_files:
    land:
      - ./land_bnd_inlet.pol
time:
  start:  2016-09-21 19:20:00
  timestep: 60S
  duration: 1D
  cfl_condition: 0.7  # CFL condition for adaptive timestep (0 = disabled)
particles:
  populations:
    - name: FineSand
      particle_type: sand
      characteristics:
        grain_size: 0.0001 
        density: 2650.0  
      tracer_methods:
        soulsby:
          flow_field_name:
            - grain_velocity
          tracer_grain_size: 0.0001
          background_grain_size: 0.0001
          soulsby_b_e: 1.7e-07
          soulsby_theta_s: 0.1
          soulsby_gamma_e: 0.1
          soulsby_mu_d: 0.5
          soulsby_freedom_factor: 1
      transport_probability: no_probability  # Options: no_probability, stochastic_transport, reduced_velocity
      seeding:
        burial_depth: 
          constant: 0
        release_start: 2016-09-21 19:30:00
        quantity: 1
        strategy: 
          random:
            bbox: "39500,16500 40500,17500"
            seed: 42
            nlocations: 10
outputs:
  #directory: .\results
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: false
    update_interval: 1H

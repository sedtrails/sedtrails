general:
  input_model: 
    format: fm_netcdf
    reference_date: 1970-01-01  # Default reference date for the input model
    morfac: 1  # Morphological acceleration factor for time decompression
inputs:
  data: ../sample-data/inlet_sedtrails.nc
  read_interval: 10D  # Time chunk size for reading input data
time:
  start:  2016-09-21 19:20:00
  timestep: 60S
  duration: 3D
  cfl_condition: 0.7  # CFL condition for adaptive timestep (0 = disabled)
particles:
  populations:
    - name: populaton_1
      particle_type: sand
      characteristics:
        grain_size: 0.00025 
        density: 2650.0  
      tracer_methods:
        vanwesten:
          suspended_velocity_method: macdonald_2006
          flow_field_name:
            - bed_load_velocity
            - suspended_velocity
      transport_probability: reduced_velocity  # Options: no_probability, stochastic_transport, reduced_velocity
      seeding:
        burial_depth:
          random: 1.
        release_start: 2016-09-21 19:30:00
        quantity: 1
        remove_permanently_buried: true
        strategy: 
          random:
            bbox: "39400,16800 40600,17800"
            poly:
              - "39400,16800"
              - "40600,16800"
              - "40600,17800"
              - "39400,17800"
            seed: 42
            nlocations: 100
outputs:
  directory: ./results/PR401
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: false
    update_interval: 1H

general:
  input_model:
    format: d3d4_netcdf
    reference_date: '1970-01-01'
    morfac: 1
inputs:
  data: ./sample-data/trim-inlet.nc
  read_interval: 10D
time:
  start: '2016-12-08 00:00:00'
  timestep: 60S
  duration: 2D
  cfl_condition: 0.7
particles:
  populations:
  - name: population_1
    particle_type: sand
    characteristics:
      grain_size: 0.00025
      density: 2650.0
    tracer_methods:
      vanwesten:
        flow_field_name:
        - bed_load_velocity
    transport_probability: no_probability
    seeding:
      burial_depth:
        constant: 0
      release_start: '2016-12-08 00:00:00'
      quantity: 1
      strategy:
        file_points:
          path: ./examples/sedtrails-example-d3d4-seeded.points.txt
          has_header: false
          x_col: 0
          y_col: 1
          deduplicate: false
          dropna: false
          stride: 1
outputs:
  directory: ./results
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: false
    update_interval: 1H

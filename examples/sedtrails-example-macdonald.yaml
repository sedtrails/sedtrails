general:
  input_model:
    format: fm_netcdf
    reference_date: 1970-01-01  # Default reference date for the input model
    morfac: 1  # Morphological acceleration factor for time decompression
inputs:
  data: ./sample-data/inlet_sedtrails.nc
  read_interval: 10D  # Time chunk size for reading input data
time:
  start:  2016-09-21 19:20:00
  timestep: 60S
  duration: 1D
  cfl_condition: 0  # CFL condition for adaptive timestep (0 = disabled)
particles:
  populations:
    - name: FineSand
      particle_type: sand
      characteristics:
        grain_size: 0.00025
        density: 2650.0
      tracer_methods:
        macdonald:
          flow_field_name:
            - centroid_particle_velocity
          computationType: "2D"
      transport_probability: no_probability  # Options: no_probability, stochastic_transport, reduced_velocity
      seeding:
        burial_depth:
          constant: 0
        release_start: 2016-09-21 19:30:00
        quantity: 1
        strategy:
          random:
            bbox: "39400,16800 40600,17800"
            seed: 42
            nlocations: 10
outputs:
  directory: ./results
  store_tracks: true
  save_interval: 1H
visualization:
  dashboard:
    enable: true
    update_interval: 1H
